<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denomination & Standard Calculator - Arun Adhikari</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            min-height: 100vh;
            padding: 8px 4px;
        }

        .calc-container {
            max-width: 580px;
            margin: 5px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
            padding: 14px;
            border: 1px solid #e2e8f0;
        }

        /* HEADER & PROFILE */
        .header-profile {
            text-align: center;
            margin-bottom: 12px;
        }

        .profile-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1e3a8a;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            margin-bottom: 4px;
        }

        .header-profile h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e3a8a;
            margin: 0;
        }

        .header-profile p {
            color: #64748b;
            font-size: 13px;
            margin-top: 2px;
        }

        /* TABS STYLING */
        .nav-tabs {
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 12px;
            justify-content: center;
        }

        .nav-tabs .nav-link {
            border: none;
            color: #64748b;
            font-weight: 600;
            font-size: 15px;
            padding: 6px 16px;
            border-radius: 8px 8px 0 0;
        }

        .nav-tabs .nav-link.active {
            color: #1e3a8a;
            border-bottom: 3px solid #1e3a8a;
            background: transparent;
        }

        /* COMPACT DENOMINATION TABLE */
        .denom-table {
            width: 100%;
        }

        .denom-row {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 3px 0 !important;
            border-bottom: 1px solid #f1f5f9;
            gap: 6px;
        }

        .denom-label {
            width: 85px !important;
            min-width: 85px !important;
            font-weight: 800;
            font-size: 17px;
            color: #0f172a;
            white-space: nowrap;
        }

        .denom-label span {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
        }

        .denom-input-box {
            flex: 1 !important;
            max-width: 115px !important;
        }

        .denom-input {
            height: 38px !important;
            padding: 2px 6px !important;
            border-radius: 6px !important;
            font-size: 17px !important;
            font-weight: 700 !important;
            text-align: center !important;
            border: 1px solid #cbd5e1 !important;
        }

        .denom-total {
            width: 115px !important;
            min-width: 115px !important;
            text-align: right !important;
            font-weight: 800;
            font-size: 17px;
            color: #0f172a;
            white-space: nowrap;
        }

        /* SUMMARY BOX & GRAND TOTAL CARD PANEL */
        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }

        .grand-total-box {
            background: #1e3a8a;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
        }

        .grand-total-box span {
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #93c5fd;
            text-transform: uppercase;
        }

        .grand-total-box h3 {
            margin: 2px 0 0;
            font-size: 28px;
            font-weight: 800;
        }

        .total-in-words {
            margin-top: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #fef08a;
            font-style: italic;
            word-wrap: break-word;
        }

        /* CALCULATOR TOP BLUE CARD PANEL */
        .calc-top-card {
            background: #1e3a8a;
            color: #ffffff;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
            margin-bottom: 12px;
        }

        .calc-top-card span {
            font-size: 12px;
            letter-spacing: 0.8px;
            color: #93c5fd;
            font-weight: 700;
            text-transform: uppercase;
        }

        .calc-top-card h3 {
            margin: 2px 0 0;
            font-size: 28px;
            font-weight: 800;
        }

        /* STANDARD CALCULATOR UI */
        .std-calc-box {
            width: 100%;
            margin: 0 auto;
            background: #0f172a;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .calc-display-container {
            background: #1e293b;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: right;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .calc-history {
            font-size: 14px;
            color: #94a3b8;
            min-height: 18px;
            word-break: break-all;
        }

        .calc-main-total {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            word-break: break-all;
            line-height: 1.1;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .calc-btn {
            height: 52px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            background: #334155;
            color: #ffffff;
            transition: transform 0.1s, background 0.1s;
        }

        .calc-btn:active {
            transform: scale(0.96);
        }

        .calc-btn-op { background: #3b82f6; }
        .calc-btn-action { background: #ef4444; }
        .calc-btn-equal {
            background: #10b981;
            grid-column: span 2;
        }

        @media (max-width: 400px) {
            .denom-label { width: 70px !important; min-width: 70px !important; font-size: 15px; }
            .denom-total { width: 100px !important; min-width: 100px !important; font-size: 15px; }
            .denom-input-box { max-width: 90px !important; }
            .denom-input { height: 35px !important; font-size: 15px !important; }
            .calc-btn { height: 46px; font-size: 18px; }
            .calc-main-total { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="calc-container">

    <!-- HEADER / PROFILE -->
    <div class="header-profile">
        <img src="photo.png" alt="Arun Adhikari" class="profile-img" onerror="this.src='https://via.placeholder.com/75?text=Arun'">
        <h2>Arun Adhikari</h2>
        <p>Financial Denomination & Standard Calculator</p>
    </div>

    <!-- DOUBLE TAB NAVIGATION -->
    <ul class="nav nav-tabs" id="calcTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="denom-tab" data-bs-toggle="tab" data-bs-target="#denom-pane" type="button" role="tab">
                <i class="bi bi-cash-stack"></i> Denomination
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="standard-tab" data-bs-toggle="tab" data-bs-target="#standard-pane" type="button" role="tab">
                <i class="bi bi-calculator"></i> Calculator
            </button>
        </li>
    </ul>

    <div class="tab-content" id="calcTabsContent">
        
        <!-- TAB 1: DENOMINATION CALCULATOR -->
        <div class="tab-pane fade show active" id="denom-pane" role="tabpanel">
            <form id="denomForm">
                <div class="denom-table">
                    
                    <!-- 1000 -->
                    <div class="denom-row">
                        <div class="denom-label">1000 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="1000" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-1000">0</div>
                    </div>

                    <!-- 500 -->
                    <div class="denom-row">
                        <div class="denom-label">500 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="500" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-500">0</div>
                    </div>

                    <!-- 100 -->
                    <div class="denom-row">
                        <div class="denom-label">100 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="100" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-100">0</div>
                    </div>

                    <!-- 50 -->
                    <div class="denom-row">
                        <div class="denom-label">50 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="50" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-50">0</div>
                    </div>

                    <!-- 20 -->
                    <div class="denom-row">
                        <div class="denom-label">20 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="20" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-20">0</div>
                    </div>

                    <!-- 10 -->
                    <div class="denom-row">
                        <div class="denom-label">10 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="10" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-10">0</div>
                    </div>

                    <!-- 5 -->
                    <div class="denom-row">
                        <div class="denom-label">5 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="5" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-5">0</div>
                    </div>

                    <!-- 2 -->
                    <div class="denom-row">
                        <div class="denom-label">2 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="2" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-2">0</div>
                    </div>

                    <!-- 1 -->
                    <div class="denom-row">
                        <div class="denom-label">1 <span>x</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" data-note="1" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total" id="total-1">0</div>
                    </div>

                    <!-- OTHER / EXTRA AMOUNT -->
                    <div class="denom-row" style="background: #f8fafc; border-top: 1.5px dashed #cbd5e1; margin-top: 3px;">
                        <div class="denom-label text-primary" style="font-size: 15px;">Other <span>(+)</span></div>
                        <div class="denom-input-box">
                            <input type="number" class="form-control denom-input" id="otherAmount" min="0" placeholder="0" oninput="calculateDenomination()">
                        </div>
                        <div class="denom-total text-primary" id="total-other">0</div>
                    </div>

                </div>

                <!-- SUMMARY CARD & GRAND TOTAL -->
                <div class="summary-card">
                    <div class="grand-total-box">
                        <span>Grand Total Amount</span>
                        <h3 id="grandTotalText">रु. 0</h3>
                        <div class="total-in-words" id="totalInWordsText">(Zero Rupees Only)</div>
                    </div>

                    <div class="text-center mt-2">
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="resetDenomination()">
                            <i class="bi bi-arrow-counterclockwise"></i> Reset All (खाली गर्नुहोस्)
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- TAB 2: STANDARD CALCULATOR -->
        <div class="tab-pane fade" id="standard-pane" role="tabpanel">
            
            <!-- CALCULATOR TOP TOTAL CARD PANEL -->
            <div class="calc-top-card">
                <span>TOTAL</span>
                <h3 id="calcTotalCardText">0</h3>
            </div>

            <!-- CALCULATOR BODY -->
            <div class="std-calc-box">
                <div class="calc-display-container">
                    <div class="calc-history" id="calcHistory"></div>
                    <div class="calc-main-total" id="calcDisplay">0</div>
                </div>

                <div class="calc-grid">
                    <button class="calc-btn calc-btn-action" onclick="clearCalc()">C</button>
                    <button class="calc-btn calc-btn-action" onclick="deleteCalc()">⌫</button>
                    <button class="calc-btn calc-btn-op" onclick="appendOp('/')">÷</button>
                    <button class="calc-btn calc-btn-op" onclick="appendOp('*')">×</button>

                    <button class="calc-btn" onclick="appendNum('7')">7</button>
                    <button class="calc-btn" onclick="appendNum('8')">8</button>
                    <button class="calc-btn" onclick="appendNum('9')">9</button>
                    <button class="calc-btn calc-btn-op" onclick="appendOp('-')">-</button>

                    <button class="calc-btn" onclick="appendNum('4')">4</button>
                    <button class="calc-btn" onclick="appendNum('5')">5</button>
                    <button class="calc-btn" onclick="appendNum('6')">6</button>
                    <button class="calc-btn calc-btn-op" onclick="appendOp('+')">+</button>

                    <button class="calc-btn" onclick="appendNum('1')">1</button>
                    <button class="calc-btn" onclick="appendNum('2')">2</button>
                    <button class="calc-btn" onclick="appendNum('3')">3</button>
                    <button class="calc-btn calc-btn-op" onclick="appendNum('.')">.</button>

                    <button class="calc-btn" onclick="appendNum('0')">0</button>
                    <button class="calc-btn" onclick="appendNum('00')">00</button>
                    <button class="calc-btn calc-btn-equal" onclick="evalCalc()">=</button>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* NUMBER TO WORDS CONVERTER */
function numberToWords(num) {
    if (isNaN(num) || num === 0) return "(Zero Rupees Only)";

    const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

    function inWords(n) {
        if ((n = n.toString()).length > 9) return 'Overflow';
        let n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n_array) return '';
        let str = '';
        str += (n_array[1] != 0) ? (a[Number(n_array[1])] || b[n_array[1][0]] + ' ' + a[n_array[1][1]]) + 'Crore ' : '';
        str += (n_array[2] != 0) ? (a[Number(n_array[2])] || b[n_array[2][0]] + ' ' + a[n_array[2][1]]) + 'Lakh ' : '';
        str += (n_array[3] != 0) ? (a[Number(n_array[3])] || b[n_array[3][0]] + ' ' + a[n_array[3][1]]) + 'Thousand ' : '';
        str += (n_array[4] != 0) ? (a[Number(n_array[4])] || b[n_array[4][0]] + ' ' + a[n_array[4][1]]) + 'Hundred ' : '';
        str += (n_array[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n_array[5])] || b[n_array[5][0]] + ' ' + a[n_array[5][1]]) : '';
        return str;
    }

    let absNum = Math.abs(num);
    let result = inWords(Math.floor(absNum)).trim();
    let prefix = num < 0 ? "Minus " : "";
    return "(" + prefix + result + " Rupees Only)";
}

/* DENOMINATION CALCULATOR LOGIC */
function calculateDenomination() {
    let grandTotal = 0;

    const noteInputs = document.querySelectorAll('.denom-input[data-note]');

    noteInputs.forEach(input => {
        const noteValue = parseFloat(input.getAttribute('data-note'));
        const count = parseFloat(input.value) || 0;
        const subtotal = noteValue * count;

        grandTotal += subtotal;

        document.getElementById(`total-${noteValue}`).textContent = subtotal.toLocaleString('en-US');
    });

    const otherVal = parseFloat(document.getElementById('otherAmount').value) || 0;
    grandTotal += otherVal;
    document.getElementById('total-other').textContent = otherVal.toLocaleString('en-US');

    document.getElementById('grandTotalText').textContent = 'रु. ' + grandTotal.toLocaleString('en-US');
    document.getElementById('totalInWordsText').textContent = numberToWords(grandTotal);
}

function resetDenomination() {
    document.getElementById('denomForm').reset();
    calculateDenomination();
}

/* STANDARD CALCULATOR LOGIC */
let calcExpr = "";
const calcDisplay = document.getElementById('calcDisplay');
const calcHistory = document.getElementById('calcHistory');
const calcTotalCardText = document.getElementById('calcTotalCardText');

function updateDisplay() {
    calcDisplay.textContent = calcExpr || "0";
}

function updateCalcTotalPanel(val) {
    let num = parseFloat(val);
    if (!isNaN(num)) {
        calcTotalCardText.textContent = num.toLocaleString('en-US');
    } else {
        calcTotalCardText.textContent = '0';
    }
}

function appendNum(num) {
    if (calcExpr === "0" && num !== ".") {
        calcExpr = num;
    } else {
        calcExpr += num;
    }
    updateDisplay();
}

function appendOp(op) {
    if (calcExpr === "") return;
    const lastChar = calcExpr.slice(-1);
    if (["+", "-", "*", "/"].includes(lastChar)) {
        calcExpr = calcExpr.slice(0, -1) + op;
    } else {
        calcExpr += op;
    }
    updateDisplay();
}

function clearCalc() {
    calcExpr = "";
    calcHistory.textContent = "";
    updateDisplay();
    updateCalcTotalPanel(0);
}

function deleteCalc() {
    calcExpr = calcExpr.slice(0, -1);
    updateDisplay();
}

function evalCalc() {
    try {
        if (!calcExpr) return;
        let originalExpr = calcExpr;
        let result = Function('"use strict"; return (' + calcExpr + ')')();
        calcExpr = String(result);
        calcHistory.textContent = originalExpr + " =";
        updateDisplay();
        updateCalcTotalPanel(result);
    } catch (e) {
        calcDisplay.textContent = "Error";
        calcHistory.textContent = "";
        calcExpr = "";
        updateCalcTotalPanel(0);
    }
}
</script>

</body>
</html>
